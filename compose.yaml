services:
  boothdotdev:
    container_name: ${APP_CONTAINER:-booth.dev}
    pull_policy: build
    build:
      context: .
      dockerfile: BoothDotDev/Dockerfile
      args:
        SOURCE_REVISION_ID: ${SOURCE_REVISION_ID:-}
    environment:
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING}
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    volumes:
      - ${LOGS_PATH}:/app/logs
      - ${DATA_PATH}:/app/data
      - ${CDN_PATH}:/app/cdn
    ports:
      - "${HTTP_PORT:-2845}:8080"
    restart: unless-stopped

  boothdotdev-db:
    container_name: ${DB_CONTAINER:-booth.dev-db}
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_PATH}:/var/lib/postgresql
    restart: unless-stopped

networks:
  default:
    driver: bridge
